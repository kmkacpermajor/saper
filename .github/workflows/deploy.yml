name: Deploy to Cloud Run

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

env:
  ARTIFACT_REPO: saper

  BACKEND_IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/saper/game-backend
  FRONTEND_IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/saper/frontend
  LEADERBOARD_IMAGE_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/saper/leaderboard-backend

  TF_STATE_BUCKET: saper-tfstate-${{ vars.GCP_PROJECT_ID }}
  TF_STATE_PREFIX: prod

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    outputs:
      backend_image: ${{ steps.image_refs.outputs.backend_image }}
      frontend_image: ${{ steps.image_refs.outputs.frontend_image }}
      leaderboard_image: ${{ steps.image_refs.outputs.leaderboard_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      #
      # BACKEND
      #
      - name: Build and push backend image
        id: build_backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: game-backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE_BASE }}:${{ github.sha }}

      #
      # FRONTEND
      #
      - name: Build and push frontend image
        id: build_frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE_BASE }}:${{ github.sha }}

      #
      # LEADERBOARD
      #
      - name: Build and push leaderboard image
        id: build_leaderboard
        uses: docker/build-push-action@v7
        with:
          context: .
          file: leaderboard-backend/Dockerfile
          push: true
          tags: ${{ env.LEADERBOARD_IMAGE_BASE }}:${{ github.sha }}

      #
      # IMAGE DIGESTS
      #
      - name: Capture image digests
        id: image_refs
        run: |
          echo "backend_image=${{ env.BACKEND_IMAGE_BASE }}@${{ steps.build_backend.outputs.digest }}" >> "$GITHUB_OUTPUT"

          echo "frontend_image=${{ env.FRONTEND_IMAGE_BASE }}@${{ steps.build_frontend.outputs.digest }}" >> "$GITHUB_OUTPUT"

          echo "leaderboard_image=${{ env.LEADERBOARD_IMAGE_BASE }}@${{ steps.build_leaderboard.outputs.digest }}" >> "$GITHUB_OUTPUT"

  apply:
    runs-on: ubuntu-latest
    environment: production
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.8.5"

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ env.TF_STATE_PREFIX }}"

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_project_number: ${{ vars.GCP_PROJECT_NUMBER }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

          TF_VAR_backend_image: ${{ needs.build.outputs.backend_image }}
          TF_VAR_frontend_image: ${{ needs.build.outputs.frontend_image }}
          TF_VAR_leaderboard_image: ${{ needs.build.outputs.leaderboard_image }}

          TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}

        run: terraform apply -input=false -auto-approve