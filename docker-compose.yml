services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: minesweeper
      POSTGRES_USER: minesweeper
      POSTGRES_PASSWORD: minesweeper
    ports:
      - "5432:5432"
    volumes:
      - leaderboard-postgres-data:/var/lib/postgresql/data

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --project=minesweeper-local --host-port=0.0.0.0:8086
    ports:
      - "8086:8086"

  leaderboard-backend:
    build:
      context: .
      dockerfile: leaderboard-backend/Dockerfile
    environment:
      DATABASE_URL: postgres://minesweeper:minesweeper@postgres:5432/minesweeper
      GOOGLE_CLOUD_PROJECT: minesweeper-local
      PUBSUB_EMULATOR_HOST: pubsub:8086
      PUBSUB_TOPIC: game-results
      PUBSUB_SUBSCRIPTION: leaderboard-game-results
      PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      - postgres
      - pubsub

  game-backend:
    build:
      context: .
      dockerfile: game-backend/Dockerfile
    environment:
      GOOGLE_CLOUD_PROJECT: minesweeper-local
      PUBSUB_EMULATOR_HOST: pubsub:8086
      PUBSUB_TOPIC: game-results
      PORT: 8085
    ports:
      - "8085:8085"
    depends_on:
      - leaderboard-backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NUXT_PUBLIC_WS_URL: ws://localhost:8085
      NUXT_PUBLIC_LEADERBOARD_URL: http://localhost:8090
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - game-backend
      - leaderboard-backend

volumes:
  leaderboard-postgres-data:
